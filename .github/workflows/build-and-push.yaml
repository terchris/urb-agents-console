# Builds the console image and points manifests/deployment.yaml and collector.yaml at it; ArgoCD does the rest.
# The dev-templates pipeline (uis.sovereignsky.no → Developing → CI/CD Pipeline), with one build
# instead of two: the app is built inside the Dockerfile only.
#
# Loop guard: changes under manifests/ do not trigger this workflow, and the commit it makes
# touches nothing else.
name: Build and push
on:
  push:
    branches: [main]
    paths-ignore:
      - "manifests/**"
  workflow_dispatch:

permissions:
  contents: write   # commit the new image tag back to manifests/deployment.yaml
  packages: write   # push the image to ghcr.io

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  # No image is built from code that fails its tests. The store tests run against a real Postgres,
  # with the schema UIS applies (config/init-database.sql).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unique image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          # Smoke test: the image must start and serve before it is pushed. Tests run the source;
          # this runs the image, which is what the cluster gets.
          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          for i in $(seq 1 20); do curl -sf localhost:3000/healthz >/dev/null && break; sleep 1; done
          curl -sf localhost:3000/healthz || { docker logs smoke; exit 1; }
          curl -sf localhost:3000/ | grep -q "The fleet, live" || { docker logs smoke; exit 1; }
          curl -sf localhost:3000/v1/openapi.json | grep -q '"openapi":"3.1.0"' || { docker logs smoke; exit 1; }
          docker rm -f smoke
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Point the manifests at the new image
        run: |
          # Both roles run the same image: the web app and the collector.
          sed -i "s|image: ghcr.io/${GITHUB_REPOSITORY,,}:.*|image: ${IMAGE}|" manifests/deployment.yaml manifests/collector.yaml
          git diff --quiet manifests/ && { echo "manifests unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml manifests/collector.yaml
          git commit -m "[ci-skip] deploy ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
